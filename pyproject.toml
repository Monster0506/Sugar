[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lark>=1.2.2",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "typing-extensions>=4.14.0",
]

[tool.setuptools]
packages = ["src"]
package-dir = {"" = "."}

[project.scripts]
sugar = "src.sugar:main"
