name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv, project dependencies, and linting tools
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        # Install project and its dependencies
        uv add black isort flake8 mypy

    - name: Run black (code formatting)
      run: |
        uv run black --check --diff src/ tests/

    - name: Run isort (import sorting)
      run: |
        uv run isort --check-only --diff --profile black src/ tests/

    - name: Run flake8 (linting)
      run: |
        uv run flake8 src/ tests/ --max-line-length=220 --extend-ignore=E203,W503,F405,F403

    - name: Run mypy (type checking)
      run: |
        uv run mypy src/ --ignore-missing-imports
      continue-on-error: true